name: Feature or plugin request
description: Suggest an improvement or a new plugin.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/mactools-app/MacTools/issues?q=is%3Aissue) first and share one idea at a time.
        A few sentences are enough; no technical solution is required.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe your use case and what is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the improvement or plugin you have in mind and the result you want.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Examples or additional information (optional)
      description: Add a screenshot, reference, related issue, or current workaround if helpful. Remove private information.
