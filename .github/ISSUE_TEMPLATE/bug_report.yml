name: Bug report
description: Tell us about a problem with MacTools or a plugin.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/mactools-app/MacTools/issues?q=is%3Aissue) first and report one problem at a time.
        A short description is enough to start. Remove private information from attachments.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Name the affected feature or plugin and describe the problem. If helpful, say what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing when it happened?
      description: A few steps or a short description is enough. Intermittent problems are welcome even without reliable reproduction steps.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: MacTools version
      description: See About. If you cannot open the app or find the version, enter "Unknown".
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System and plugin details (optional)
      description: Fill in what you know; leave the rest blank.
      placeholder: |
        macOS version:
        Plugin version (if relevant):
        Mac model or chip:
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional information (optional)
      description: Attach a screenshot, short recording, relevant logs, or anything else that helps explain the problem.
